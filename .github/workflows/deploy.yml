# 애보사 자체 주소 판: 앱 빌드 → 병원·약국 자료 받기 → GitHub Pages 배포
# 필요한 저장소 비밀 값(Settings → Secrets and variables → Actions):
#   DATA_GO_KR_KEY  공공데이터포털 일반 인증키(Decoding) — 국립중앙의료원 병·의원 찾기·약국 정보 활용신청 후
#   KAKAO_JS_KEY    카카오 개발자 앱의 JavaScript 키 — 카카오맵 사용 설정 ON, JavaScript SDK 도메인에 Pages 주소 등록 후
# 자료 받기가 실패하면, 이미 배포된 자료가 있을 때는 배포하지 않아 직전 판이 남고, 없을 때는 자료 없이 앱만 배포한다.
name: 애보사 배포
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'   # 매일 03:00(한국 시간)에 병원·약국 자료를 다시 받는다
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 앱 빌드(브랜드 정책 검사 포함)
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
        run: python3 -I -B build.py
      - name: 병원·약국 자료 받기(키가 없거나, 받기에 실패했는데 배포된 자료도 없으면 자료 없이 배포)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          LIVE_META: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/clinics/meta.json
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then
            echo "::warning::DATA_GO_KR_KEY가 없어 병원·약국 자료 없이 배포합니다"
          elif ! python3 -I -B fetch_clinics.py; then
            if curl -sf -o /dev/null "$LIVE_META"; then
              echo "::error::병원·약국 자료 받기에 실패해 배포하지 않습니다. 직전에 배포된 판과 자료가 그대로 남습니다"
              exit 1
            fi
            echo "::warning::병원·약국 자료 받기에 실패했고 배포된 자료도 없어, 자료 없이 앱만 배포합니다"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
