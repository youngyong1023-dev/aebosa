# 영상 목록 새로 받기: 공식 채널 업로드 전체를 YouTube Data API로 받아 catalog.json을 다시 만든다(fetch_youtube.py).
# 필요한 비밀 값: YOUTUBE_API_KEY. '받기만'(dry)으로 돌리면 건수만 기록에 남기고 목록은 바꾸지 않는다.
# 목록을 바꾸면 커밋하고 '애보사 배포'를 실행한다(봇 커밋은 push 실행을 만들지 않아서 직접 부른다).
# 매주 월요일 04:30(한국 시간)에 다시 받는다(유튜브 API 정보는 주기적으로 새로 받는다). API 사용량은 한 번에 약 4,600단위(하루 10,000단위).
name: 영상 목록 새로 받기
on:
  schedule:
    - cron: '30 19 * * 0'
  workflow_dispatch:
    inputs:
      dry:
        description: '받기만 하고 목록은 바꾸지 않기'
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 공식 채널 영상 받기
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 -I -B fetch_youtube.py ${{ inputs.dry && '--dry' || '' }}
      - name: 목록 올리고 배포 실행
        if: ${{ !inputs.dry }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json data/works
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "영상 목록 새로 받기(YouTube Data API 채널 업로드, 작품별 전체)"
          git push
          gh workflow run deploy.yml
